<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Trunk Gradient -->
    <linearGradient id="treeTrunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D4037" />
      <stop offset="40%" stop-color="#795548" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>

    <!-- Canopy Gradient -->
    <radialGradient id="treeCanopyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#22C55E" />
      <stop offset="85%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </radialGradient>

    <!-- Base Shadow -->
    <filter id="treeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.22" flood-color="#0F172A" />
    </filter>
  </defs>

  <g filter="url(#treeShadow)">
    <!-- Soil / Ground Mound -->
    <ellipse cx="50" cy="88" rx="28" ry="6" fill="#8D6E63" opacity="0.6" />
    <ellipse cx="50" cy="87" rx="22" ry="4.5" fill="#6D4C41" />

    <!-- Sturdy Tree Trunk -->
    <path d="M 44 86 C 45 76 46 64 43 54 C 47 56 53 56 57 54 C 54 64 55 76 56 86 C 53 87 47 87 44 86 Z" fill="url(#treeTrunkGrad)" />
    
    <!-- Trunk Branch Roots -->
    <path d="M 45 68 C 42 63 37 60 34 61 C 36 63 41 66 44 71 Z" fill="#5D4037" />
    <path d="M 55 66 C 58 61 63 59 66 60 C 64 62 59 65 56 69 Z" fill="#4E342E" />

    <!-- Lush Foliage Background Depth -->
    <circle cx="34" cy="46" r="17" fill="#15803D" />
    <circle cx="66" cy="46" r="17" fill="#15803D" />
    <circle cx="50" cy="30" r="20" fill="#166534" />

    <!-- Main Vibrant Foliage Canopy -->
    <circle cx="50" cy="40" r="25" fill="url(#treeCanopyGrad)" />
    <circle cx="35" cy="44" r="16" fill="url(#treeCanopyGrad)" />
    <circle cx="65" cy="44" r="16" fill="url(#treeCanopyGrad)" />
    <circle cx="42" cy="28" r="15" fill="#4ADE80" opacity="0.5" />

    <!-- Canopy Highlights -->
    <circle cx="44" cy="32" r="11" fill="#86EFAC" opacity="0.45" />
    <circle cx="32" cy="42" r="8" fill="#86EFAC" opacity="0.35" />
    <circle cx="62" cy="38" r="7" fill="#86EFAC" opacity="0.3" />
  </g>
</svg>
